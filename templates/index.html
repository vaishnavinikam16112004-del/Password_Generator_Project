<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
</head>
<body>
  <h1>Password Generator</h1>

  <form method="post">
    <label>
      Password length:
      <input type="number" name="length" min="1" max="1024" value="12" required>
    </label>

    <p>Select character types:</p>
    <label><input type="checkbox" name="lower" checked> Lowercase letters</label><br>
    <label><input type="checkbox" name="upper" checked> Uppercase letters</label><br>
    <label><input type="checkbox" name="digits" checked> Numbers</label><br>
    <label><input type="checkbox" name="symbols"> Symbols</label><br><br>

    <button type="submit">Generate password</button>
  </form>

  {% if error %}
    <p>{{ error }}</p>
  {% endif %}

  {% if password %}
    <h2>Your password:</h2>
    <p><strong>{{ password }}</strong></p>
  {% endif %}
</body>
</html>
